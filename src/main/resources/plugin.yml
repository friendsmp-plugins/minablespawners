name: minablespawners
version: '${version}'
main: com.centers25.minablespawners.TrialMinerPlugin
api-version: '26.2'
description: Mine safe trial spawners while preserving configuration, cooldown, and ominous state.
author: centers25
depend: [plugincore]
commands:
  mineablespawners:
    description: Manage mineable trial spawners.
    usage: /mineablespawners <reload|give|debug>
permissions:
  mineablespawners.mine:
    description: Allows mining trial spawners and receiving the state-preserving drop.
    default: true
  mineablespawners.admin:
    description: Allows reloading config and giving trial spawner items.
    default: op
